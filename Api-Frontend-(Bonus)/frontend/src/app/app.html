<a class="skip-link" href="#main">Saltar al contenido</a>

<header class="nav">
  <div class="container nav-in">
    <a class="logo" routerLink="/" aria-label="Biblioteca de Alejandría — inicio">
      <span class="logo-mark" aria-hidden="true">❦</span>
      <span class="logo-text">Biblioteca <b>de Alejandría</b></span>
    </a>

    <nav class="links" aria-label="Principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/catalog" routerLinkActive="active">Explorar</a>
      @if (auth.user(); as u) {
        <a routerLink="/profile" routerLinkActive="active" class="user">Hola, {{ u.nombre }}</a>
        <button class="btn btn-ghost" (click)="logout()">Salir</button>
      } @else {
        <a routerLink="/login" class="btn btn-ghost">Ingresar</a>
      }
    </nav>
  </div>
</header>

<main id="main">
  <router-outlet />
</main>

<footer class="foot">
  <div class="container">
    <b>Biblioteca de Alejandría</b> · Proyecto Base de Datos I — Hito 2 · datos servidos desde PostgreSQL
  </div>
</footer>
